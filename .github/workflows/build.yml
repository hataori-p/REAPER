name: Build Reaper EXE
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure CMake
        # We use -A x64 to ensure it builds a 64-bit executable
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: reaper-windows-bin
          # This path points exactly to where CMake puts the exe on Windows
          path: build/Release/reaper.exe
          if-no-files-found: error
